# Dagger workspace configuration
# Install modules with: dagger module install <module>
# Example:
#   dagger module install dagger.io/linux/wolfi

[modules]

[modules.go-sdk]
source = "dagger.io/sdk/go"

[sdks.go]
module = "go-sdk"

[modules.goauth]
source = ".dagger/modules/goauth"

[sdks.go.scopes.".dagger/modules/goauth"]
is-module = true
name = "goauth"
